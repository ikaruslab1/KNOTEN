<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modo sin conexión — Knoten</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #fafafa;
      color: #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      margin: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #f4f4f5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 10px;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      color: #71717a;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background: #18181b;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #27272a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Modo sin conexión</h1>
    <p>No tienes conexión a internet en este momento. Sin embargo, las actividades y sesiones descargadas previamente siguen disponibles en tu dispositivo.</p>
    <a href="/" class="btn">Ir a mis cursos descargados</a>
  </div>
</body>
</html>
